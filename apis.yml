aid: toucan
name: Toucan
description: >-
  Toucan builds digital infrastructure for carbon credit markets, providing the
  rails for buying, selling, and retiring carbon credits on-chain. Its Carbon
  Bridge tokenizes credits from registries like Puro Earth into TCO2 tokens,
  carbon pools such as CHAR (biochar) bundle credits into liquid reference
  tokens, and retirement certificates prove offsets on-chain. Developers build
  on Toucan through audited smart contracts on Base, Celo, and Polygon, the
  toucan-sdk JavaScript/TypeScript SDK, and GraphQL subgraphs served through The
  Graph on six networks.
